{% extends "base.html" %}
{% from "_macros.html" import doc_table with context %}
{% block title %}Chứng từ · Chứng từ số{% endblock %}
{% block content %}
<div class="page-head">
  <h1>Chứng từ</h1>
  <a class="btn btn-primary" href="{{ url_for('main.new_document') }}">Nộp chứng từ</a>
</div>
<form class="filters" method="get" action="{{ url_for('main.list_documents') }}">
  <label>Tìm kiếm
    <input type="search" name="q" value="{{ keyword }}" placeholder="Số, tiêu đề, người nộp">
  </label>
  <label>Trạng thái
    <select name="status">
      <option value="">Tất cả</option>
      {% for key, label in STATUS_LABELS.items() %}
      <option value="{{ key }}" {% if key == status %}selected{% endif %}>{{ label }}</option>
      {% endfor %}
    </select>
  </label>
  <label>Loại
    <select name="type">
      <option value="">Tất cả</option>
      {% for key, label in DOC_TYPES.items() %}
      <option value="{{ key }}" {% if key == doc_type %}selected{% endif %}>{{ label }}</option>
      {% endfor %}
    </select>
  </label>
  <button class="btn" type="submit">Lọc</button>
</form>
<section class="card">
  {{ doc_table(docs, "Không có chứng từ phù hợp.") }}
</section>
{% endblock %}
